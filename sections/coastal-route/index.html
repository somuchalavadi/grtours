<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>GR Coastal Route Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Kannada:wght@500;600&display=swap">
<style>
/* Layout (from the sketch): one big glass panel pinned on screen. The van stays on the left and the route line slides under it.
   When a place's dot reaches the van, a small title card pops at the top and the place's 3D image blends in on the right. One light look. */
:root{
  --bg:#EEF4FB; --ink:#0B1F44; --ink-2:#475569; --ink-3:#94A3B8; --red:#D52A33; --navy:#0B1F44; --line:#C9D6E6; --shadow:rgba(14,42,92,.18);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --kn:"Noto Sans Kannada","Inter",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:#1e293b;font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip}
p,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:12px}

/* liquid glass bits (same as Tour Plans) */
.lg,.lg-on{position:relative;isolation:isolate;border:0;border-radius:999px}
.lg{background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(220,235,250,.2) 55%,rgba(255,255,255,.32));-webkit-backdrop-filter:blur(12px) saturate(1.9);backdrop-filter:blur(12px) saturate(1.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(14,42,92,.08),inset 0 0 12px rgba(255,255,255,.35),0 10px 24px -12px rgba(14,42,92,.3)}
.lg-on{color:var(--ink);background:linear-gradient(180deg,rgba(214,234,252,.88),rgba(170,208,240,.45));box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(14,42,92,.12),0 8px 18px -8px rgba(14,42,92,.35)}
.lg::before,.lg-on::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,#fff 0%,rgba(255,255,255,.25) 30%,rgba(14,42,92,.2) 62%,rgba(255,255,255,.9) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--red)}

/* section */
.journey{position:relative;isolation:isolate;overflow-x:clip;height:calc(100svh + 10.5 * 65svh)}
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.g1{top:0;left:8%;width:600px;height:600px;background:radial-gradient(circle,rgba(160,210,245,.8),transparent 70%);filter:blur(60px)}
.g2{top:30%;right:-6%;width:520px;height:520px;background:radial-gradient(circle,rgba(253,220,140,.6),transparent 70%);filter:blur(70px)}
.g3{bottom:0;left:-6%;width:600px;height:600px;background:radial-gradient(circle,rgba(150,225,215,.6),transparent 70%);filter:blur(70px)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);height:100svh;display:flex;align-items:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{position:relative;width:100%;max-width:1240px;height:min(680px,100%);margin:0 auto;border-radius:36px;overflow:hidden;
  background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 40px 80px -30px var(--shadow),inset 0 1px 2px rgba(255,255,255,.95)}

.head{position:absolute;left:28px;top:24px;z-index:5;display:grid;gap:8px}
.head h2{font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:300;letter-spacing:-.02em;color:var(--ink)}
.head h2 b{font-weight:700}
.count{position:absolute;right:28px;top:28px;z-index:5;font-size:.75rem;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* title card (top centre) */
.card{position:absolute;left:42%;top:clamp(76px,12%,96px);z-index:6;width:min(300px,calc(100% - 40px));padding:12px 16px 14px;border-radius:18px;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 24px 50px -24px var(--shadow),inset 0 1px 1px #fff;transform:translateX(-50%) translateY(-10px) scale(.92);opacity:0;transition:opacity .35s ease,transform .5s cubic-bezier(.3,1.5,.5,1)}
.card.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.card .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:7px;margin-bottom:7px;border-bottom:1px solid rgba(255,255,255,.9)}
.card h3{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.card .kn{font-family:var(--kn);font-weight:600;font-size:.8rem;color:var(--red)}
.card .tag{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.card li{display:flex;gap:8px;align-items:baseline;font-size:.78rem;color:#334155}
.card li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--navy);transform:translateY(-1px)}
.card.show li{animation:li .45s cubic-bezier(.2,.8,.2,1) both}
.card.show li:nth-child(2){animation-delay:.06s}.card.show li:nth-child(3){animation-delay:.12s}
@keyframes li{from{opacity:0;transform:translateX(10px)}}
.card .go{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:.72rem;font-weight:600;color:#fff;text-decoration:none;padding:5px 12px 5px 5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(40,70,128,.8),rgba(10,30,70,.92));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.3),0 10px 22px -12px rgba(10,30,70,.6);transition:transform .25s}
.card .go:hover{transform:translateY(-1px)}
.card .go span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#7BE3A6,#22B262 55%,#13814A)}
.card .go svg{width:11px;height:11px}

/* place image (right, blended, no frame) */
.place{position:absolute;right:3%;bottom:22%;z-index:3;width:min(38%,470px);aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.place img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateY(40px) scale(.7);filter:drop-shadow(0 26px 30px rgba(14,42,92,.16));
  transition:opacity .45s ease,transform .7s cubic-bezier(.3,1.45,.5,1)}
.place img.show{opacity:1;transform:none}
.place img.show{animation:float 6s ease-in-out .7s infinite}
@keyframes float{50%{translate:0 -8px}}
.place .soon{position:absolute;inset:18% 14%;border-radius:50%;border:2px dashed rgba(14,42,92,.18);display:grid;place-items:center;text-align:center;font-size:.78rem;font-weight:600;color:var(--ink-3);opacity:0;transform:scale(.85);transition:opacity .4s,transform .6s cubic-bezier(.3,1.45,.5,1)}
.place .soon.show{opacity:1;transform:none}

/* route line */
svg.route{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}
.route .base{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
.route .done{fill:none;stroke:url(#gr);stroke-width:4;stroke-linecap:round}
.route .dot{fill:#fff;stroke:#9FB0C7;stroke-width:3;transition:fill .3s,stroke .3s}
.route .dot.past{fill:var(--navy);stroke:var(--navy)}
.route .dot.now{fill:var(--red);stroke:#fff;stroke-width:4}
.route .halo{fill:none;stroke:var(--red);stroke-width:2;opacity:0}
.route .halo.now{animation:halo 1.6s ease-out infinite}
@keyframes halo{from{opacity:.9;r:9}to{opacity:0;r:26}}
.route text{font-family:var(--f);font-size:13px;font-weight:600;fill:#64748B;text-anchor:middle}
.route text.now{fill:var(--ink);font-weight:700}

/* van: fixed on the left, only the line moves */
.van{position:absolute;z-index:4;width:clamp(170px,22vw,280px);aspect-ratio:516/241;transform-origin:50% 100%;pointer-events:none}
.van .body{position:absolute;inset:0;background:url(img/van.webp) center/100% 100% no-repeat}
.van.moving .body{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.van .w{position:absolute;border-radius:50%;background-size:100% 100%;background-repeat:no-repeat}
.van .wr{left:calc(68/516*100%);top:calc(172/241*100%);width:calc(68/516*100%);aspect-ratio:1;background-image:url(img/wheel-r.png)}
.van .wf{left:calc(400/516*100%);top:calc(169/241*100%);width:calc(70/516*100%);aspect-ratio:1;background-image:url(img/wheel-f.png)}
.van.moving .w{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.van .speed{position:absolute;left:-26%;top:38%;width:24%;height:34%;opacity:0;transition:opacity .3s}
.van.moving .speed{opacity:1}
.van .speed i{position:absolute;right:0;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(14,42,92,.25));animation:streak .6s linear infinite}
.van .speed i:nth-child(1){top:10%;width:80%}.van .speed i:nth-child(2){top:45%;width:100%;animation-delay:-.2s}.van .speed i:nth-child(3){top:80%;width:60%;animation-delay:-.4s}
@keyframes streak{from{transform:translateX(30%);opacity:0}40%{opacity:1}to{transform:translateX(-40%);opacity:0}}
.van .puff{position:absolute;left:-4%;bottom:6%;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 6px rgba(14,42,92,.12);opacity:0}
.van.moving .puff{animation:puff 1s ease-out infinite}
.van.moving .puff:nth-of-type(2){animation-delay:.33s}.van.moving .puff:nth-of-type(3){animation-delay:.66s}
@keyframes puff{from{transform:translate(0,0) scale(.4);opacity:.9}to{transform:translate(-50px,-10px) scale(1.7);opacity:0}}

.van .empty{position:absolute;right:0;bottom:0;height:100%;width:auto;opacity:1;transition:opacity .35s}
.van .body,.van .w{transition:opacity .35s}
.van.rev{animation:rev .09s linear infinite}
@keyframes rev{0%{translate:0 0}25%{translate:.8px -.6px}50%{translate:-.6px .4px}75%{translate:.5px .7px}100%{translate:0 0}}
.van.rev .puff{animation:puff .7s ease-out infinite}
.driver{position:absolute;z-index:5;pointer-events:none;transform-origin:50% 100%;will-change:transform,opacity}
.driver img{display:block;height:100%;width:auto;filter:drop-shadow(0 6px 6px rgba(14,42,92,.18));animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(-2deg) translateY(-2px)}}
.driver .say{position:absolute;bottom:100%;left:50%;margin-bottom:6px;transform:translateX(-30%);white-space:nowrap;font-size:.72rem;font-weight:600;color:var(--ink);padding:6px 11px;border-radius:12px 12px 12px 3px;
  background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 18px -10px var(--shadow);animation:say 2.4s ease-in-out infinite}
@keyframes say{50%{transform:translateX(-30%) translateY(-3px)}}
.intro{position:absolute;left:42%;z-index:6;width:min(320px,calc(100% - 40px));padding:14px 18px 16px;border-radius:18px;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border:1px solid rgba(255,255,255,.95);box-shadow:0 24px 50px -24px var(--shadow),inset 0 1px 1px #fff;
  transform:translateX(-50%);transition:opacity .4s ease,transform .5s cubic-bezier(.3,1.4,.5,1)}
.intro.off{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.94);pointer-events:none}
.intro .k{font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.intro h3{margin-top:4px;font-size:1.15rem;font-weight:300;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
.intro h3 b{font-weight:700}
.intro p{margin-top:6px;font-size:.78rem;color:var(--ink-2)}
@media (max-width:760px){.intro{left:50%}}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--ink-3);transition:opacity .4s}
.hint i{width:15px;height:23px;border:1.5px solid var(--ink-3);border-radius:9px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:5px;margin-left:-1px;border-radius:1px;background:var(--ink-3);animation:wheel 1.4s ease-in-out infinite}
@keyframes wheel{to{transform:translateY(8px);opacity:0}}
.hint.off{opacity:0}

@media (max-width:760px){
  .panel{height:min(760px,100%)}
  .head{left:20px;top:18px}
  .count{right:20px;top:24px}
  .card{left:50%;top:70px}
  .place{right:50%;transform:translateX(50%);bottom:24%;width:min(62%,280px)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

</defs></svg>

<section class="journey" id="journey">
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
  <div class="stage">
    <div class="panel" id="panel">
      <div class="head">
        <span class="chip lg"><i></i>Coastal route</span>
        <h2>Explore the coastal &amp; <b>Western Ghats beauty</b></h2>
      </div>

      <svg class="route" id="route" aria-hidden="true">
        <defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#0B1F44"/><stop offset="1" stop-color="#D52A33"/></linearGradient></defs>
        <g id="track"><path class="base" id="pBase"/><path class="done" id="pDone"/><g id="dots"></g></g>

  </div>
</section>

<script>
(function(){
  var WA = '919620936143';
  var STOPS = [
    {n:'Mangaluru', kn:'ಮಂಗಳೂರು', tag:'Airport city', img:'img/mangaluru.webp', li:['Mangaluru Airport pickups and drops','Panambur and Tannirbhavi beaches','Kadri Manjunatha temple']},
    {n:'Udupi', kn:'ಉಡುಪಿ', tag:'Temple town', img:'img/udupi.webp', li:['Sri Krishna Matha and the car street','Malpe beach and St Mary’s Island','Kaup lighthouse on the rocks']},
    {n:'Kundapura', kn:'ಕುಂದಾಪುರ', tag:'Sea meets river', img:'img/kundapura.webp', li:['Maravanthe: sea on one side, river on the other','Gateway to Kollur Mookambika temple']},
    {n:'Murdeshwar', kn:'ಮುರುಡೇಶ್ವರ', tag:'Our home base', img:'img/murdeshwar.webp', li:['Giant seated Shiva statue','Raja Gopura tower with a lift to the top','Boat trips to Netrani Island']},
    {n:'Honnavar', kn:'ಹೊನ್ನಾವರ', tag:'River & backwaters', img:'img/honnavar.webp', li:['Sharavathi backwater boat rides','The road inland to Jog Falls','Kasarkod Eco Beach']},
    {n:'Kumta', kn:'ಕುಮಟಾ', tag:'Forts & forests', img:'img/kumta.webp', li:['Mirjan Fort by the Aghanashini river','The giant black rocks of Yana']},
    {n:'Gokarna', kn:'ಗೋಕರ್ಣ', tag:'Temple & beaches', img:'img/gokarna.webp', li:['Mahabaleshwar temple','Om, Kudle and Half Moon beaches']},
    {n:'Sirsi', kn:'ಶಿರಸಿ', tag:'Temples & falls', img:'img/sirsi.webp', li:['Sri Marikamba temple','Sahasralinga in the Shalmala river','Unchalli Falls nearby']}
  ];
  var N = STOPS.length;
  var section = document.getElementById('journey'), panel = document.getElementById('panel');
  var svg = document.getElementById('route'), track = document.getElementById('track'), pBase = document.getElementById('pBase'), pDone = document.getElementById('pDone'), dotsG = document.getElementById('dots');
  var van = document.getElementById('van'), place = document.getElementById('place'), card = document.getElementById('card');
  var cName = document.getElementById('cName'), cKn = document.getElementById('cKn'), cTag = document.getElementById('cTag'), cList = document.getElementById('cList'), cGo = document.getElementById('cGo');
  var hint = document.getElementById('hint');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  // place images (preloaded, one layer each)
  var layers = STOPS.map(function(s){
    var el;
    if (s.img){ el = new Image(); el.src = s.img; el.alt = s.n; el.decoding = 'async'; }
    else { el = document.createElement('div'); el.className = 'soon'; el.textContent = s.n + ' image coming soon'; }
    place.appendChild(el); return el;
  });

  // geometry
  var W, H, SP, AX, AY, pts = [], samples = [], L = 0, dots = [];
  function build(){
    var r = panel.getBoundingClientRect(); W = r.width; H = r.height;
    var phone = W < 760;
    SP = phone ? W * .78 : W * .44;                  // distance between places
    AX = phone ? W * .34 : W * .26;                  // where the van sits
    AY = phone ? H * .84 : H * .78;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    // a gently rising, waving road like the sketch
    pts = [];
    for (var i = -1; i <= N; i++) pts.push({x: i * SP, y: -i * (phone ? 10 : 16) + Math.sin(i * 1.7) * (phone ? 16 : 26)});
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    for (i = 0; i < pts.length - 1; i++){
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += ' C' + (p1.x + (p2.x - p0.x) / 6) + ',' + (p1.y + (p2.y - p0.y) / 6) + ' ' + (p2.x - (p3.x - p1.x) / 6) + ',' + (p2.y - (p3.y - p1.y) / 6) + ' ' + p2.x + ',' + p2.y;
    }
    pBase.setAttribute('d', d); pDone.setAttribute('d', d);
    L = pBase.getTotalLength();
    samples = []; for (var s = 0; s <= 800; s++){ var q = pBase.getPointAtLength(L * s / 800); samples.push({l: L * s / 800, x: q.x, y: q.y}); }
    // dots + labels
    dotsG.innerHTML = ''; dots = [];
    STOPS.forEach(function(st, k){
      var x = k * SP, y = atX(x).y;
      var g = document.createElementNS(NS, 'g');
      var halo = document.createElementNS(NS, 'circle'); halo.setAttribute('cx', x); halo.setAttribute('cy', y); halo.setAttribute('r', 9); halo.setAttribute('class', 'halo');
      var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 8); c.setAttribute('class', 'dot');
      var t = document.createElementNS(NS, 'text'); t.setAttribute('x', x); t.setAttribute('y', y + 32); t.textContent = st.n;
      g.appendChild(halo); g.appendChild(c); g.appendChild(t); dotsG.appendChild(g);
      dots.push({halo: halo, c: c, t: t});
    });
    var hd = panel.querySelector('.head');
    card.style.top = (hd.offsetTop + hd.offsetHeight + (phone ? 12 : 18)) + 'px';
    intro.style.top = card.style.top;
    var vh = van.offsetHeight; driverH = vh * 0.92;
    driver.style.height = driverH + 'px'; driver.style.width = (driverH * 308 / 600) + 'px';
    driver.style.top = (AY + 6 - driverH) + 'px';
    driverX0 = AX - van.offsetWidth * .52 + van.offsetWidth + 14;     // standing in front of the van
    driverX1 = AX - van.offsetWidth * .52 + van.offsetWidth * .62;    // at the driver's door
    van.style.left = (AX - van.offsetWidth * .52) + 'px';
    van.style.top = (AY - van.offsetHeight + 6) + 'px';
    fitPlace(phone);
    last = -1; lastIk = -1;
  }
  // phones: size the place image to the free space between the title card and the van, so nothing overlaps
  function cardMaxHeight(){
    // measure a hidden copy of the title card filled with each place, without touching the real card
    var probe = card.cloneNode(true), max = 0;
    probe.removeAttribute('id'); probe.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
    probe.className = 'card show'; probe.style.visibility = 'hidden'; probe.style.transition = 'none'; probe.setAttribute('aria-hidden', 'true');
    panel.appendChild(probe);
    var h3 = probe.querySelector('h3'), kn = probe.querySelector('.kn'), tg = probe.querySelector('.tag'), ul = probe.querySelector('ul');
    STOPS.forEach(function(st){
      h3.textContent = st.n; kn.textContent = st.kn; tg.textContent = st.tag; ul.innerHTML = '';
      st.li.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      max = Math.max(max, probe.offsetHeight);
    });
    panel.removeChild(probe);
    return max;
  }
  function fitPlace(phone){
    if (!phone){ ['top','bottom','left','right','width','height','transform','aspectRatio'].forEach(function(k){ place.style[k] = ''; }); return; }
    var top = card.offsetTop + Math.max(cardMaxHeight(), intro.offsetHeight) + 10;
    var bottom = AY - van.offsetHeight - 4;                // just above the van roof
    var size = Math.max(90, Math.min(W * .8, 320, bottom - top));
    place.style.top = (top + (bottom - top - size) / 2) + 'px';
    place.style.bottom = 'auto'; place.style.right = 'auto';
    place.style.left = ((W - size) / 2) + 'px';
    place.style.transform = 'none';
    place.style.width = size + 'px'; place.style.height = size + 'px'; place.style.aspectRatio = 'auto';
  }
  function atX(x){
    var lo = 0, hi = samples.length - 1;
    while (hi - lo > 1){ var m = (lo + hi) >> 1; if (samples[m].x < x) lo = m; else hi = m; }
    var a = samples[lo], b = samples[hi], k = (x - a.x) / ((b.x - a.x) || 1);
    return {x: x, y: a.y + (b.y - a.y) * k, l: a.l + (b.l - a.l) * k, ang: Math.atan2(b.y - a.y, b.x - a.x)};
  }

  // scroll -> position along the route, with a pause at every place
  function smooth(t){ return t * t * (3 - 2 * t); }
  var START = -0.62, IN = 1.5, DR = 0.8;      // intro length and the first drive, in "stop" units
  function posFromScroll(){
    var r = section.getBoundingClientRect(), span = section.offsetHeight - innerHeight;
    var p = Math.max(0, Math.min(1, -r.top / (span || 1)));
    var t = p * (IN + DR + N - 1 + .35);
    if (t < IN) return {pos: START, k: t / IN, p: p};
    t -= IN;
    if (t < DR) return {pos: START + (0 - START) * smooth(t / DR), k: 1, p: p};
    t -= DR;
    var i = Math.floor(t), f = t - i;
    if (i >= N - 1) return {pos: N - 1, k: 1, p: p};
    return {pos: i + smooth(Math.max(0, Math.min(1, (f - .35) / .65))), k: 1, p: p};
  }
  var driver = document.getElementById('driver'), intro = document.getElementById('intro');
  var emptyVan = van.querySelector('.empty'), famBody = van.querySelector('.body'), wheels = van.querySelectorAll('.w');
  var driverH = 0, driverX0 = 0, driverX1 = 0, ik = 0, lastIk = -1;
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function renderIntro(k){
    // 0-.3 welcome · .3-.7 driver walks to the door, family boards · .7-1 engine starts
    var walk = smooth(clamp01((k - .3) / .32));
    var board = smooth(clamp01((k - .5) / .2));
    driver.style.transform = 'translateX(' + (driverX0 + (driverX1 - driverX0) * walk) + 'px) scale(' + (1 - .12 * walk) + ')';
    driver.style.left = '0px';
    driver.style.opacity = 1 - smooth(clamp01((k - .52) / .14));
    emptyVan.style.opacity = 1 - board;
    famBody.style.opacity = board; wheels.forEach(function(w){ w.style.opacity = board; });
    intro.classList.toggle('off', k > .8);
    van.classList.toggle('rev', k > .72 && k < 1);
  }

  var shown = -2, last = -1, cur = START;
  function show(k){
    if (k === shown) return; shown = k;
    layers.forEach(function(el, j){ el.classList.toggle('show', j === k); });
    if (k < 0){ card.classList.remove('show'); return; }
    var s = STOPS[k];
    cName.textContent = s.n; cKn.textContent = s.kn; cTag.textContent = s.tag;
    cList.innerHTML = ''; s.li.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; cList.appendChild(li); });
    cGo.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hi GR Tours & Travels, I want to plan a trip to ' + s.n + '. Please share the fare.');
    card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
  }

  var lastT = 0;
  function frame(now){
    var dt = Math.min(.1, ((now || 0) - lastT) / 1000 || .016); lastT = now || 0;
    var st = posFromScroll();
    var e = reduce ? 1 : 1 - Math.exp(-dt * 7);
    cur += (st.pos - cur) * e;
    ik += (st.k - ik) * e; if (Math.abs(st.k - ik) < .001) ik = st.k;
    if (ik !== lastIk){ renderIntro(ik); lastIk = ik; }
    if (Math.abs(st.pos - cur) < .0005) cur = st.pos;
    if (cur !== last){
      var x = cur * SP, q = atX(x);
      track.setAttribute('transform', 'translate(' + (AX - q.x) + ',' + (AY - q.y) + ')');
      pDone.style.strokeDasharray = q.l + ' ' + L;
      pDone.style.opacity = ik < 1 ? 0 : 1;
      var tilt = Math.max(-8, Math.min(8, q.ang * 180 / Math.PI));
      van.style.transform = 'rotate(' + tilt.toFixed(2) + 'deg)';
      var near = Math.round(cur), arrived = Math.abs(cur - near) < .06;
      dots.forEach(function(d, k){
        var now = arrived && k === near;
        d.c.setAttribute('class', 'dot' + (now ? ' now' : k <= cur ? ' past' : ''));
        d.halo.setAttribute('class', 'halo' + (now ? ' now' : ''));
        d.t.setAttribute('class', now ? 'now' : '');
      });
      van.classList.toggle('moving', !arrived && cur > START + .01);
      show(near);   // a place stays until the van is halfway to the next stop, then the next one takes over
      last = cur;
    }
    hint.classList.toggle('off', st.p > .02);
    requestAnimationFrame(frame);
  }
  addEventListener('resize', build);
  build(); requestAnimationFrame(frame);
})();
</script>
