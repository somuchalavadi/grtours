<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>GR Tour Plans One Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: the section pins; one liquid-glass card holds the current plan (details | scene, then scene | details). Scrolling swaps the plan inside the same card. Scenes sit on a soft studio backdrop that matches the 3D renders, so they look clean. One light look by design. */
:root{
  --bg:#EEF4FB; --ink:#0B1F44; --ink-2:#475569; --ink-3:#94A3B8; --hair:rgba(255,255,255,.65);
  --red:#D52A33; --navy:#0B1F44; --shadow:rgba(14,42,92,.18);
  --studio-1:#EFEFF1; --studio-2:#E4E4E7;
  --water:#9CD6F0; --water-2:#E9F7FF; --cliff:#6B6F7A; --cliff-2:#8E929C; --grass:#5DAA5C; --grass-2:#3E8B48; --soil:#9A6B43; --soil-2:#7D5232;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:#1e293b;font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip}
h2,h3{margin:0;font-weight:300;letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
h2 b,h3 b{font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:12px}

/* ---------- liquid glass ---------- */
.glass-card{background:rgba(255,255,255,.30);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 40px 80px -30px var(--shadow),inset 0 1px 2px rgba(255,255,255,.95);border-radius:30px}
.lg,.lg-on,.dot-btn{position:relative;isolation:isolate;border:0;border-radius:999px}
.lg{background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(220,235,250,.2) 55%,rgba(255,255,255,.32));-webkit-backdrop-filter:blur(12px) saturate(1.9);backdrop-filter:blur(12px) saturate(1.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(14,42,92,.08),inset 0 0 12px rgba(255,255,255,.35),0 10px 24px -12px rgba(14,42,92,.3)}
.lg-on{color:var(--ink);background:linear-gradient(180deg,rgba(214,234,252,.88),rgba(170,208,240,.45));-webkit-backdrop-filter:blur(14px) saturate(2);backdrop-filter:blur(14px) saturate(2);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(14,42,92,.12),inset 0 0 10px rgba(40,100,180,.15),0 8px 18px -8px rgba(14,42,92,.35)}
.lg::before,.lg-on::before,.dot-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;background:linear-gradient(140deg,#fff 0%,rgba(255,255,255,.25) 30%,rgba(14,42,92,.2) 62%,rgba(255,255,255,.9) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lg-on::before{background:linear-gradient(140deg,#fff,rgba(255,255,255,.2) 35%,rgba(14,42,92,.38) 65%,#fff)}
.lg::after,.lg-on::after,.dot-btn::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:48%;border-radius:999px 999px 60% 60%/999px 999px 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:.75rem;font-weight:600;letter-spacing:.02em;color:#475569}
.chip.lg-on{font-weight:700;color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--navy)}
.chip i.r{background:var(--red)}

.seg{display:inline-flex;align-items:center;gap:2px;padding:5px;position:relative}
.seg .knob{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(214,234,252,.95),rgba(170,208,240,.55));box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(14,42,92,.12),inset 0 0 0 1px rgba(14,42,92,.16),0 6px 16px -6px rgba(14,42,92,.4);transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1)}
.seg button{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:8px 18px;font-size:.78rem;font-weight:600;color:#64748B;white-space:nowrap;transition:color .25s}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg.sm{padding:4px}.seg.sm .knob{top:4px;bottom:4px}.seg.sm button{padding:5px 13px;font-size:.72rem}

.dot-btn{width:28px;height:28px;display:grid;place-items:center;font-weight:700;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(225,238,250,.35));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px rgba(14,42,92,.1),0 4px 10px -4px rgba(14,42,92,.35);transition:transform .2s}
.dot-btn:hover{transform:translateY(-1px)}.dot-btn:active{transform:scale(.9)}

.btn-navy{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:11px 24px 11px 11px;border-radius:999px;color:#fff;font-weight:600;font-size:.9rem;text-decoration:none;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(40,70,128,.8),rgba(10,30,70,.92));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.3),inset 0 0 14px rgba(120,170,255,.2),0 14px 30px -12px rgba(10,30,70,.6);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.btn-navy::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:46%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.btn-navy::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:.6s ease}
.btn-navy:hover{transform:translateY(-2px) scale(1.02);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.3),0 20px 36px -12px rgba(10,30,70,.65)}
.btn-navy:hover::before{left:100%}
.btn-navy:active{transform:scale(.98)}
.btn-navy > *{position:relative;z-index:1}
.wa{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#7BE3A6,#22B262 55%,#13814A);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.2),0 4px 10px -4px rgba(31,163,90,.8)}
.wa svg{width:14px;height:14px}

/* ---------- section ---------- */
.journey{position:relative;isolation:isolate;overflow:clip}
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.g1{top:-8%;left:10%;width:620px;height:620px;background:radial-gradient(circle,rgba(160,210,245,.85),transparent 70%);filter:blur(60px)}
.g2{top:18%;right:-8%;width:540px;height:540px;background:radial-gradient(circle,rgba(253,220,140,.7),transparent 70%);filter:blur(70px)}
.g3{bottom:-10%;left:-8%;width:640px;height:640px;background:radial-gradient(circle,rgba(150,225,215,.7),transparent 70%);filter:blur(70px)}
.g4{top:45%;left:35%;width:480px;height:480px;background:radial-gradient(circle,rgba(180,215,250,.6),transparent 70%);filter:blur(80px)}
.stage{padding-block:clamp(40px,7vw,80px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto;display:grid;gap:28px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.kicker{margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
.top h2{font-size:clamp(2.2rem,4.6vw,3.3rem);line-height:1.05}
.top .right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hint{display:none;align-items:center;gap:8px;font-size:.75rem;color:var(--ink-3);transition:opacity .4s}
.hint i{width:15px;height:23px;border:1.5px solid var(--ink-3);border-radius:9px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:5px;margin-left:-1px;border-radius:1px;background:var(--ink-3);animation:wheel 1.4s ease-in-out infinite}
@keyframes wheel{to{transform:translateY(8px);opacity:0}}
.hint.off{opacity:0}

.list{display:grid;gap:28px}
.plan{display:grid;overflow:hidden}
@media (min-width:1000px){.plan{grid-template-columns:7fr 5fr}.plan.flip{grid-template-columns:5fr 7fr}.plan.flip .scene{order:-1}}
.info{padding:clamp(22px,3.4vw,40px);display:grid;gap:18px;align-content:space-between;min-width:0}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.chips .seg{margin-left:auto}
.info h3{font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.05}
.lede{color:#475569;font-weight:300;font-size:.98rem;margin-top:8px}
.stops{list-style:none;margin:0;padding:0}
.stops li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.stops li:last-child{border-bottom:0}
.stops .when{width:100px;flex:none;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stops .what{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500;color:#334155;min-width:0}
.stops .what::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#CBD5E1}
.stops li.key .what::before{background:var(--red)}
.anim li{animation:slide .45s cubic-bezier(.2,.8,.2,1) both}
.anim li:nth-child(2){animation-delay:.05s}.anim li:nth-child(3){animation-delay:.1s}.anim li:nth-child(4){animation-delay:.15s}.anim li:nth-child(5){animation-delay:.2s}
@keyframes slide{from{transform:translateX(12px);opacity:0}}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--hair)}
.trav{display:flex;align-items:center;gap:12px;padding:7px 10px 7px 16px}
.trav span{font-size:.75rem;font-weight:500;color:#475569}
.trav output{min-width:20px;text-align:center;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.price{font-size:.75rem;color:var(--ink-3)}

/* custom */
.lbl{display:block;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks button{padding:6px 13px;font-size:.78rem;font-weight:500;color:#475569;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.picks button:hover{transform:translateY(-1px)}
.picks button.lg-on{font-weight:600}
.picks button.lg-on::marker{content:none}
.opts{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-end}

/* scene: the 3D island floats on the glass card, no inner frame */
.scene{position:relative;min-height:300px;display:flex;align-items:center;justify-content:center;padding:28px}
.scene::before{content:"";position:absolute;left:22%;right:22%;bottom:9%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(14,42,92,.22),transparent);animation:shadow 6s ease-in-out infinite}
@keyframes shadow{50%{transform:scaleX(.88);opacity:.7}}
.scene .tagc{position:absolute;top:20px;right:20px;z-index:3}
.plan.flip .scene .tagc{right:auto;left:20px}
.scene .art{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;animation:bob 6s ease-in-out infinite}
.scene img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(14,42,92,.14))}
.scene img.soft{-webkit-mask-image:radial-gradient(closest-side at 50% 50%,#000 68%,transparent 100%);mask-image:radial-gradient(closest-side at 50% 50%,#000 68%,transparent 100%);filter:none}
.scene.van img{max-width:100%}
.scene svg{width:80%;height:auto;max-height:90%}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- pinned mode: one card, plans swap inside ---------- */
@media (min-width:1000px) and (min-height:680px) and (prefers-reduced-motion:no-preference){
  .journey{height:calc(100svh + 3 * 80svh)}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);height:100svh;display:flex;align-items:center;padding-block:28px}
  .inner{width:100%}
  .hint{display:flex}
  .list{position:relative;height:min(600px,calc(100svh - 210px));gap:0}
  .list{display:block;background:rgba(255,255,255,.30);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 40px 80px -30px var(--shadow),inset 0 1px 2px rgba(255,255,255,.95);border-radius:30px}
  .plan{position:absolute;inset:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;visibility:hidden;pointer-events:none;transition:visibility 0s linear .7s}
  .plan.on{visibility:visible;pointer-events:auto;transition-delay:0s}
  .plan .info,.plan .scene{opacity:0;transition:opacity .55s ease,transform .8s cubic-bezier(.16,.84,.3,1)}
  .plan .scene{transform:translateX(60px) scale(.96)}
  .plan.flip .scene{transform:translateX(-60px) scale(.96)}
  .plan .info{transform:translateY(18px)}
  .plan.gone .scene{transform:translateY(-30px) scale(.96)}
  .plan.gone .info{transform:translateY(-18px)}
  .plan.on .info,.plan.on .scene{opacity:1;transform:none}
  .plan.on .info{transition-delay:.1s}
  .scene{min-height:0}
  .info{gap:14px;padding:32px 36px}
  .stops li{padding:10px 0}
  .plan-custom .info{gap:14px}
}
@media (max-width:999px){
  .tabs{display:none}
  .scene{min-height:260px;order:-1}
  .scene .art{height:260px}
}
/* ---------- pinned mode on phones/tablets: same one-card swap, stacked ---------- */
@media (max-width:999px) and (min-height:560px) and (prefers-reduced-motion:no-preference){
  .journey{height:calc(100svh + 3 * 80svh)}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);height:100svh;display:flex;padding-block:16px calc(80px + env(safe-area-inset-bottom,0px))}
  .inner{width:100%;height:100%;grid-template-rows:auto 1fr;gap:12px}
  .top{gap:10px}
  .kicker{margin-bottom:8px}
  .top h2{font-size:1.9rem}
  .tabs{display:inline-flex}
  .tabs button{padding:7px 11px;font-size:.72rem}
  .list{position:relative;display:block;min-height:0;gap:0;background:rgba(255,255,255,.30);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 60px -30px var(--shadow),inset 0 1px 2px rgba(255,255,255,.95);border-radius:26px}
  .plan{position:absolute;inset:0;display:flex;flex-direction:column;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;visibility:hidden;pointer-events:none;transition:visibility 0s linear .7s}
  .plan.on{visibility:visible;pointer-events:auto;transition-delay:0s}
  .plan .info,.plan .scene{opacity:0;transition:opacity .55s ease,transform .8s cubic-bezier(.16,.84,.3,1)}
  .plan .scene{transform:translateX(50px) scale(.95)}
  .plan.flip .scene{transform:translateX(-50px) scale(.95)}
  .plan .info{transform:translateY(16px)}
  .plan.gone .scene{transform:translateY(-24px) scale(.95)}
  .plan.gone .info{transform:translateY(-16px)}
  .plan.on .info,.plan.on .scene{opacity:1;transform:none}
  .plan.on .info{transition-delay:.1s}
  .scene{flex:0 0 34%;min-height:0;padding:10px 10px 0}
  .scene .art{height:100%}
  .scene .tagc{top:12px;right:12px}
  .plan.flip .scene .tagc{left:12px}
  .info{flex:1;min-height:0;padding:12px 18px 16px;gap:10px;align-content:start;display:flex;flex-direction:column}
  .info > .foot{margin-top:auto}
  .info h3{font-size:1.45rem}
  .lede{font-size:.84rem;margin-top:4px}
  .stops li{padding:6px 0}
  .stops .what{font-size:.84rem}
  .foot{padding-top:10px;gap:8px;flex-wrap:nowrap;justify-content:space-between}
  .foot .btn-navy{flex-shrink:0;padding:7px 14px 7px 7px;font-size:.8rem;gap:8px;white-space:nowrap}
  .foot .btn-navy .wa{flex-shrink:0}
  .foot .wa{width:24px;height:24px}
  .trav{gap:7px;padding:5px 6px 5px 12px}
  .trav span{font-size:.68rem}
  .trav{flex-shrink:1;min-width:0}
  .trav .dot-btn{width:24px;height:24px}
  .picks{gap:6px}
  .picks button{padding:4px 10px;font-size:.7rem}
  .lbl{margin-bottom:5px}
}
@media (max-width:400px) and (min-height:560px) and (prefers-reduced-motion:no-preference){.trav span{display:none}}
@media (max-width:999px) and (min-height:560px) and (max-height:740px) and (prefers-reduced-motion:no-preference){
  .lede{display:none}
  .scene{flex-basis:30%}
}
@media (max-width:560px){
  .stops .when{width:78px;font-size:.62rem}
  .chips .seg{margin-left:0}
  .foot{justify-content:center}
}

/* falls drawing */
.fall{stroke-dasharray:6 10;animation:pour .7s linear infinite}.fall.b{animation-duration:.9s}.fall.c{animation-duration:.6s}
@keyframes pour{to{stroke-dashoffset:-16}}
.mist{animation:mist 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.mist.b{animation-delay:-1.5s}
@keyframes mist{to{transform:scale(1.15);opacity:.55}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></symbol>
</defs></svg>

<section class="journey" id="plans">
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="glow g4"></span>
  <div class="stage">
    <div class="inner">
      <div class="top">
        <div>
          <span class="chip lg kicker"><i class="r"></i>Tour plans</span>
          <h2>Choose your <b>escape</b></h2>
        </div>
        <div class="right">
          <span class="hint" id="hint"><i></i>Scroll for the next plan</span>
          <div class="lg seg tabs" id="tabs" role="tablist" aria-label="Tour plans"><span class="knob"></span></div>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</section>

<template id="falls-art">
  <svg viewBox="0 0 300 260" aria-hidden="true">
    <ellipse cx="150" cy="214" rx="128" ry="30" fill="var(--soil-2)"/>
    <path d="M22 196v18c0 17 57 30 128 30s128-13 128-30v-18Z" fill="var(--soil)"/>
    <ellipse cx="150" cy="196" rx="128" ry="30" fill="var(--grass)"/>
    <ellipse cx="160" cy="203" rx="62" ry="14" fill="var(--water)"/>
    <ellipse cx="160" cy="203" rx="40" ry="8" fill="var(--water-2)" opacity=".6"/>
    <path d="M70 196C66 150 74 104 96 76c18-22 50-30 78-26 30 4 52 20 62 46 10 28 8 68 0 100Z" fill="var(--cliff)"/>
    <path d="M96 76c18-22 50-30 78-26 30 4 52 20 62 46-24-14-50-18-76-14-26 4-46 6-64-6Z" fill="var(--grass-2)"/>
    <path d="M118 88c10 30 8 70 2 108M200 92c6 30 6 70 0 104" stroke="var(--cliff-2)" stroke-width="5" fill="none" opacity=".5"/>
    <g stroke="#fff" stroke-linecap="round" fill="none">
      <path class="fall" d="M132 70v130" stroke-width="9"/><path class="fall b" d="M150 66v134" stroke-width="7"/>
      <path class="fall c" d="M168 68v132" stroke-width="10"/><path class="fall b" d="M186 74v126" stroke-width="6"/>
    </g>
    <ellipse class="mist" cx="158" cy="198" rx="44" ry="12" fill="#fff" opacity=".85"/>
    <ellipse class="mist b" cx="140" cy="190" rx="22" ry="9" fill="#fff" opacity=".7"/>
    <g fill="var(--grass-2)">
      <circle cx="58" cy="176" r="14"/><circle cx="46" cy="186" r="10"/><rect x="56" y="180" width="4" height="16" fill="var(--soil-2)"/>
      <circle cx="244" cy="174" r="15"/><circle cx="258" cy="186" r="10"/><rect x="242" y="178" width="4" height="18" fill="var(--soil-2)"/>
      <circle cx="104" cy="62" r="10"/><circle cx="210" cy="64" r="11"/><circle cx="226" cy="74" r="8"/>
    </g>

<script>
(function(){
  var WA = '919620936143';
  var PLANS = [
    {id:'murdeshwar', tab:'Murdeshwar', dur:'Full day', kind:'Temple & sea', tag:'Murdeshwar', h:'Murdeshwar <b>Darshan</b>', name:'Murdeshwar Darshan', art:'img/murdeshwar-island.webp', cut:true, alt:'3D Murdeshwar island with the seated Shiva statue and Raja Gopura tower',
     lede:'The big temple, a hidden waterfall and a sunset on the beach.',
     days:[[['Morning','Murdeshwar temple & Shiva statue',1],['Noon','Idagunji Maha Ganapati'],['Afternoon','Apsarakonda falls & beach'],['Evening','Murdeshwar beach sunset',1]]]},
    {id:'falls', tab:'Falls', dur:'2 days · 1 night', kind:'Western Ghats', tag:'Jog · Sirsi · Yana', h:'Uttara Kannada <b>Falls</b>', name:'Uttara Kannada Falls', art:'img/falls-island.webp', cut:true, alt:'3D Uttara Kannada island with Jog Falls, Yana rocks and a Sirsi-style temple',
     lede:'Waterfalls, forest temples and the giant rocks of Yana.',
     days:[[['Morning','Jog Falls',1],['Afternoon','Sirsi Marikamba temple'],['Night','Stay in Sirsi']],
           [['Morning','Sahasralinga'],['Noon','Unchalli Falls',1],['Afternoon','Yana rocks'],['Evening','Back to Murdeshwar']]]},
    {id:'karavali', tab:'Karavali', dur:'2 days · 1 night', kind:'Coast road', tag:'Udupi · Gokarna', h:'Full Karavali <b>Coast</b>', name:'Full Karavali Coast', art:'img/karavali-island.webp', cut:true, alt:'3D Karavali coast island with a lighthouse, Udupi temple, temple chariot and fishing boats',
     lede:'South to Udupi on day one, north to Gokarna on day two.',
     days:[[['Morning','Maravanthe beach road'],['Noon','Udupi Sri Krishna Matha',1],['Evening','Malpe beach'],['Night','Stay in Udupi']],
           [['Morning','Honnavar backwaters'],['Noon','Mirjan Fort, Kumta'],['Afternoon','Gokarna Om beach',1],['Evening','Back to Murdeshwar']]]},
    {id:'custom', tab:'Custom', dur:'Your pace', kind:'Your plan', tag:'Any place, any day', h:'Make your <b>own</b>', art:'img/van-island.webp', cut:true, alt:'The GR Tours van full of happy travellers on a small island road', custom:true,
     lede:'Pick the places. We plan the route, the timing and the right vehicle.'}
  ];
  var PLACES = ['Murdeshwar','Netrani Island','Idagunji','Gokarna','Jog Falls','Sirsi','Yana','Kollur','Udupi','Honnavar','Kumta','Mangaluru Airport'];
  var LENS = ['Half day','1 day','2 days','3+ days'];
  var N = PLANS.length;
  var list = document.getElementById('list'), tabsEl = document.getElementById('tabs'), hint = document.getElementById('hint');
  var section = document.getElementById('plans'), falls = document.getElementById('falls-art');
  var pinMQ = matchMedia('(min-width:1000px) and (min-height:680px) and (prefers-reduced-motion:no-preference), (max-width:999px) and (min-height:560px) and (prefers-reduced-motion:no-preference)');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function wa(t){ return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t); }
  function navyBtn(cls, label){ return '<a class="btn-navy ' + cls + '" href="https://wa.me/' + WA + '" target="_blank" rel="noopener"><span class="wa"><svg><use href="#i-wa"/></svg></span><span>' + label + ' →</span></a>'; }
  function stopsHTML(d){ return d.map(function(r){ return '<li' + (r[2] ? ' class="key"' : '') + '><span class="when">' + esc(r[0]) + '</span><span class="what">' + esc(r[1]) + '</span></li>'; }).join(''); }
  function seg(cls, label, items, sel){
    return '<div class="lg seg ' + cls + '" role="tablist" aria-label="' + label + '"><span class="knob"></span>' +
      items.map(function(t, i){ return '<button type="button" role="tab" data-i="' + i + '" aria-selected="' + (i === sel) + '">' + esc(t) + '</button>'; }).join('') + '</div>';
  }
  function placeKnob(s){ var k = s.querySelector('.knob'), b = s.querySelector('[aria-selected="true"]'); if (!k || !b) return; k.style.width = b.offsetWidth + 'px'; k.style.transform = 'translateX(' + b.offsetLeft + 'px)'; }
  function wireSeg(s, cb){ s.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ s.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-selected', x === b); }); placeKnob(s); cb && cb(+b.dataset.i); }); }); }

  var plans = PLANS.map(function(p, i){
    var el = document.createElement('article');
    el.className = 'plan glass-card' + (i % 2 ? ' flip' : '') + (p.custom ? ' plan-custom' : '');
    el.id = 'plan-' + p.id;
    var head = '<div class="chips"><span class="chip lg-on"><i></i>' + esc(p.dur) + '</span><span class="chip lg">' + esc(p.kind) + '</span>' +
      (p.days && p.days.length > 1 ? seg('sm days', 'Day', ['Day 1','Day 2'], 0) : '') + '</div>' +
      '<div><h3>' + p.h + '</h3><p class="lede">' + esc(p.lede) + '</p></div>';
    var body;
    if (p.custom){
      body = '<div><span class="lbl">Places</span><div class="picks">' + PLACES.map(function(n){ var on = n === 'Murdeshwar' || n === 'Jog Falls'; return '<button type="button" class="' + (on ? 'lg-on' : 'lg') + '" data-p="' + esc(n) + '" aria-pressed="' + on + '">' + esc(n) + '</button>'; }).join('') + '</div></div>' +
        '<div class="opts"><div><span class="lbl">How long</span>' + seg('sm lens', 'How long', LENS, 1) + '</div></div>';
    } else {
      body = '<ol class="stops">' + stopsHTML(p.days[0]) + '</ol>';
    }
    var foot = '<div class="foot">' + navyBtn('book', p.custom ? 'Send my plan' : 'Book this trip') +
      '<div class="lg trav"><span>Travellers</span><button type="button" class="dot-btn" data-t="-1" aria-label="Fewer travellers">−</button><output>4</output><button type="button" class="dot-btn" data-t="1" aria-label="More travellers">+</button></div></div>';
    var art = p.art === 'falls' ? '' : '<img src="' + p.art + '"' + (p.cut ? '' : ' class="soft"') + ' alt="' + esc(p.alt) + '" decoding="async">';
    el.innerHTML = '<div class="info"><div style="display:grid;gap:14px">' + head + '</div>' + body + foot + '</div>' +
      '<div class="scene' + (p.custom ? ' van' : '') + '"><span class="chip lg-on tagc"><i class="r"></i>' + esc(p.tag) + '</span><div class="art">' + art + '</div></div>';
    if (p.art === 'falls') el.querySelector('.art').appendChild(falls.content.cloneNode(true));
    list.appendChild(el);

    // state per plan
    var st = {day:0, pax:4, places:{'Murdeshwar':1,'Jog Falls':1}, len:'1 day'};
    var book = el.querySelector('.book'), out = el.querySelector('output');
    function msg(){
      if (p.custom){
        var pl = PLACES.filter(function(n){ return st.places[n]; });
        return 'Hi GR Tours & Travels, I want a custom trip.\nPlaces: ' + (pl.length ? pl.join(', ') : 'please suggest') + '\nDuration: ' + st.len + '\nTravellers: ' + st.pax + '\nPlease suggest a plan and price.';
      }
      return 'Hi GR Tours & Travels, I would like to book the ' + p.name + ' tour (' + p.dur + ') for ' + st.pax + ' traveller(s). Please share the price and available dates.';
    }
    function refresh(){ out.textContent = st.pax; book.href = wa(msg()); }
    el.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click', function(){ st.pax = Math.max(1, Math.min(40, st.pax + +b.dataset.t)); refresh(); }); });
    var d = el.querySelector('.days');
    if (d) wireSeg(d, function(k){ st.day = k; var ol = el.querySelector('.stops'); ol.innerHTML = stopsHTML(p.days[k]); ol.classList.remove('anim'); void ol.offsetWidth; ol.classList.add('anim'); });
    var ln = el.querySelector('.lens');
    if (ln) wireSeg(ln, function(k){ st.len = LENS[k]; refresh(); });
    el.querySelectorAll('[data-p]').forEach(function(b){ b.addEventListener('click', function(){ var n = b.dataset.p; if (st.places[n]) delete st.places[n]; else st.places[n] = 1; b.className = st.places[n] ? 'lg-on' : 'lg'; b.setAttribute('aria-pressed', !!st.places[n]); refresh(); }); });
    refresh();
    return el;
  });

  // tabs
  tabsEl.insertAdjacentHTML('beforeend', PLANS.map(function(p, i){ return '<button type="button" role="tab" data-i="' + i + '" aria-selected="' + (i === 0) + '">' + esc(p.tab) + '</button>'; }).join(''));
  var tabs = tabsEl.querySelectorAll('button');
  tabs.forEach(function(b){ b.addEventListener('click', function(){ goTo(+b.dataset.i); }); });

  function allKnobs(){ document.querySelectorAll('.seg').forEach(placeKnob); }
  var active = -1;
  function setActive(i){
    if (i === active) return; active = i;
    plans.forEach(function(el, k){ el.classList.toggle('on', k === i); el.classList.toggle('gone', k < i); el.inert = pinMQ.matches ? k !== i : false; });
    tabs.forEach(function(t, k){ t.setAttribute('aria-selected', k === i); });
    placeKnob(tabsEl);
  }
  function goTo(i){
    if (!pinMQ.matches){ plans[i].scrollIntoView({behavior:'smooth', block:'start'}); return; }
    var span = section.offsetHeight - innerHeight;
    scrollTo({top: section.offsetTop + span * ((i + .5) / N), behavior:'smooth'});
  }
  var ticking = false;
  function frame(){
    ticking = false;
    if (pinMQ.matches){
      var r = section.getBoundingClientRect(), span = section.offsetHeight - innerHeight;
      var p = Math.max(0, Math.min(.9999, -r.top / (span || 1)));
      setActive(Math.min(N - 1, Math.floor(p * N)));
      hint.classList.toggle('off', p > .02);
    } else {
      plans.forEach(function(el){ el.inert = false; el.classList.add('on'); el.classList.remove('gone'); });
      active = -1;
    }
  }
  addEventListener('scroll', function(){ if (!ticking){ ticking = true; requestAnimationFrame(frame); } }, {passive:true});
  addEventListener('resize', function(){ active = -1; frame(); allKnobs(); });
  frame(); if (pinMQ.matches) setActive(0);
  allKnobs();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(allKnobs);
})();
</script>
