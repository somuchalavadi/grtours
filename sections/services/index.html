<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>GR Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a calm, static section. Heading left, then a 3-column grid of glass cards (2 on tablet, 1 on phone).
   Scuba and Rooms carry an "Also available" chip so they stand out without any motion. One light look, same glass as the other sections. */
:root{
  --bg:#EEF4FB; --ink:#0B1F44; --ink-2:#475569; --ink-3:#94A3B8; --red:#D52A33; --wa:#1FA35A; --shadow:rgba(14,42,92,.16);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:#1e293b;font-family:var(--f);-webkit-font-smoothing:antialiased}
h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px}

.sec{position:relative;isolation:isolate;overflow:hidden;padding-block:clamp(56px,8vw,96px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.g1{top:-10%;left:5%;width:560px;height:560px;background:radial-gradient(circle,rgba(160,210,245,.75),transparent 70%);filter:blur(60px)}
.g2{bottom:-15%;right:-5%;width:520px;height:520px;background:radial-gradient(circle,rgba(253,220,140,.55),transparent 70%);filter:blur(70px)}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:32px}

/* glass bits (same recipe as Tour Plans) */
.lg{position:relative;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(220,235,250,.2) 55%,rgba(255,255,255,.32));-webkit-backdrop-filter:blur(12px) saturate(1.9);backdrop-filter:blur(12px) saturate(1.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(14,42,92,.08),0 10px 24px -12px rgba(14,42,92,.3)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,#fff 0%,rgba(255,255,255,.25) 30%,rgba(14,42,92,.2) 62%,rgba(255,255,255,.9) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--red)}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.head h2{margin-top:12px;font-size:clamp(2rem,4.4vw,3.1rem);font-weight:300;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
.head h2 b{font-weight:700}
.head p{max-width:40ch;color:var(--ink-2);font-weight:300}

.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-content:start;padding:22px;border-radius:24px;
  background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 60px -36px var(--shadow),inset 0 1px 2px rgba(255,255,255,.95)}
.ic{grid-row:span 2;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(214,234,252,.55));box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(14,42,92,.1),0 8px 18px -10px rgba(14,42,92,.35)}
.ic svg{width:26px;height:26px}
.card.hi .ic{color:#fff;background:linear-gradient(180deg,#2A4E8E,#0E2A5C);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 20px -10px rgba(14,42,92,.6)}
.card h3{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);align-self:end}
.card p{font-size:.88rem;color:var(--ink-2);line-height:1.45}
.card .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.card .badge{font-size:.6rem;padding:4px 10px;color:#0E2A5C}
.card .ask{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--ink);text-decoration:none;padding:6px 14px 6px 6px}
.card .ask span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 28%,#7BE3A6,#22B262 55%,#13814A)}
.card .ask svg{width:12px;height:12px}
.card .ask:hover{color:#0E2A5C;text-decoration:underline}

.note{font-size:.8rem;color:var(--ink-3)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></symbol>
</defs></svg>

<section class="sec" id="services">
  <span class="glow g1"></span><span class="glow g2"></span>
  <div class="wrap">
    <div class="head">
      <div>
        <span class="chip lg"><i></i>Services</span>
        <h2>Everything for your <b>trip</b></h2>
      </div>
      <p>From the airport to the dive boat to your room for the night, one call to GR Tours &amp; Travels covers it.</p>
    </div>

    <div class="grid" id="grid"></div>
    <p class="note">Scuba diving depends on sea conditions and the season. Ask us for current availability.</p>
  </div>
</section>

<script>
(function(){
  var WA = '919620936143';
  var ICONS = {
    plane:'<path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5Z"/>',
    road:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 19h8a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h8"/></g>',
    family:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M12.5 20a4 4 0 0 1 8 0"/></g>',
    bag:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3.5 12.5h17"/></g>',
    dive:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h13a3 3 0 0 1 0 6h-2l-2-2-2 2H6a3 3 0 0 1-3-3Z"/><path d="M19 11h2V5"/><path d="M3 19c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/></g>',
    bed:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7M21 18v-5a3 3 0 0 0-3-3h-7v8"/><path d="M3 14h18"/><circle cx="7" cy="11" r="2"/></g>'
  };
  var S = [
    {ic:'plane', t:'Airport pickup & drop', d:'Mangaluru, Hubballi and Goa airports. Tell us your flight time and we plan the drive.', m:'airport pickup / drop'},
    {ic:'road', t:'Outstation trips', d:'One-way or round trips across Karnataka, Goa and beyond, with a driver who knows the roads.', m:'an outstation trip'},
    {ic:'family', t:'Family & group trips', d:'Comfortable vehicles for families and pilgrim groups, with room for luggage and stops on the way.', m:'a family trip'},
    {ic:'bag', t:'Tour packages', d:'Ready day plans for Murdeshwar, the waterfalls and the full Karavali coast.', m:'a tour package'},
    {ic:'dive', t:'Scuba diving at Netrani', d:'Dive the coral reefs of Netrani Island near Murdeshwar. Ask us to arrange your dive.', m:'scuba diving at Netrani Island', hi:true},
    {ic:'bed', t:'Rooms wherever we go', d:'Need a place to stay? We arrange rooms at every stop on your trip, on the coast or in the Ghats.', m:'rooms for my trip', hi:true}
  ];
  var g = document.getElementById('grid');
  S.forEach(function(s){
    var a = document.createElement('article'); a.className = 'card' + (s.hi ? ' hi' : '');
    var href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hi GR Tours & Travels, I would like to know about ' + s.m + '.');
    a.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[s.ic] + '</svg></span>' +
      '<h3></h3><p></p>' +
      '<div class="foot"><a class="ask lg" target="_blank" rel="noopener"><span><svg><use href="#i-wa"/></svg></span>Ask on WhatsApp</a>' +
      (s.hi ? '<span class="chip lg badge">Also available</span>' : '') + '</div>';
    a.querySelector('h3').textContent = s.t; a.querySelector('p').textContent = s.d; a.querySelector('.ask').href = href;
    g.appendChild(a);
  });
})();
</script>
