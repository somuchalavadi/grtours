<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta charset="utf-8">
<title>GR Trip Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
/* Trip Planner: a gold ✦ button above the WhatsApp button opens a liquid-glass panel (desktop) or bottom sheet (phone).
   Everything is position:fixed, so the section adds no height to the page. Plans are made in the browser from the
   built-in place data below; there are no network calls. */
:root{
  --ink:#0B1F44; --ink-2:#475569; --ink-3:#8593A8; --red:#D52A33; --navy:#0B1F44; --gold:#F5B31B; --gold-ink:#8A5A00;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:#EEF4FB;color:#1e293b;font-family:var(--f);-webkit-font-smoothing:antialiased}
.tp p,.tp h2,.tp h3,.tp h4,.tp ol,.tp ul{margin:0}
:where(.tp) button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tp :focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.tp-panel:focus{outline:none}
.tp .ico{width:18px;height:18px;flex:none}

/* liquid glass (same recipe as the other sections) */
.lg,.lg-on{position:relative;isolation:isolate;border:0}
.lg{background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(220,235,250,.3) 55%,rgba(255,255,255,.45));-webkit-backdrop-filter:blur(12px) saturate(1.9);backdrop-filter:blur(12px) saturate(1.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(14,42,92,.07),inset 0 0 12px rgba(255,255,255,.35),0 8px 20px -12px rgba(14,42,92,.3)}
.lg-on{color:var(--ink);background:linear-gradient(180deg,rgba(214,234,252,.92),rgba(170,208,240,.5));-webkit-backdrop-filter:blur(14px) saturate(2);backdrop-filter:blur(14px) saturate(2);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(14,42,92,.12),inset 0 0 0 1.5px rgba(11,31,68,.55),0 8px 18px -8px rgba(14,42,92,.35)}
.lg::before,.lg-on::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;background:linear-gradient(140deg,#fff 0%,rgba(255,255,255,.25) 30%,rgba(14,42,92,.2) 62%,rgba(255,255,255,.9) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lg-on::before{background:linear-gradient(140deg,#fff,rgba(255,255,255,.2) 35%,rgba(14,42,92,.38) 65%,#fff)}
.lg::after,.lg-on::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:46%;border-radius:999px 999px 60% 60%/999px 999px 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));pointer-events:none;z-index:-1}

/* launcher: sits above the "Chat with us" button (script measures it; these are the fallbacks) */
.tp-launch{position:fixed;z-index:31;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;transition:opacity .25s,transform .3s,visibility 0s}
@media (max-width:560px){.tp-launch{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.tp.open .tp-launch{opacity:0;visibility:hidden;transform:translateY(10px) scale(.9);transition:opacity .2s,transform .3s,visibility 0s .3s}
.tp-lbl{border-radius:999px;padding:9px 16px;font-size:.85rem;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;user-select:none;transition:opacity .2s,visibility 0s}
/* step aside while it would cover a button of the section underneath: first the label, then the whole launcher */
.tp-launch.nolbl .tp-lbl,.tp-launch.tuck{opacity:0;visibility:hidden;transition:opacity .2s,transform .25s,visibility 0s .25s}

@media (max-width:639px){.tp-lbl{display:none}}
.tp-spark{position:relative;width:54px;height:54px;flex:none;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 34% 26%,#FFE9A8 0%,#FFCB45 30%,#F5B31B 58%,#C98A06 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.75),inset 0 -4px 8px rgba(150,95,0,.35),0 0 0 1px rgba(201,138,6,.28),0 12px 24px -10px rgba(201,138,6,.8);transition:transform .25s}
.tp-spark::before{content:"";position:absolute;left:15%;right:15%;top:5%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}
.tp-spark::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;animation:tpPulse 6s ease-out infinite}
@keyframes tpPulse{0%,76%{box-shadow:0 0 0 0 rgba(245,179,27,0)}80%{box-shadow:0 0 0 0 rgba(245,179,27,.6),0 0 16px 2px rgba(245,179,27,.45)}100%{box-shadow:0 0 0 18px rgba(245,179,27,0),0 0 28px 6px rgba(245,179,27,0)}}
.tp-spark svg{position:relative;width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(140,90,0,.45))}
.tp-spark:hover{transform:translateY(-2px) scale(1.04)}
.tp-spark:active{transform:scale(.96)}

/* panel: desktop card / phone bottom sheet */
.tp-scrim{position:fixed;inset:0;z-index:58;background:rgba(11,31,68,.34);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;touch-action:none}
.tp.open .tp-scrim{opacity:1;visibility:visible;transition:opacity .3s}
@media (min-width:640px){.tp-scrim{display:none}}
.tp-panel{position:fixed;z-index:60;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 40px);
  max-height:min(680px,calc(100vh - 120px));max-height:min(680px,calc(100svh - 120px));display:flex;flex-direction:column;border-radius:28px;overflow:hidden;isolation:isolate;color:var(--ink);
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),linear-gradient(180deg,rgba(241,247,253,.66),rgba(233,241,250,.74));
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:0 40px 80px -30px rgba(14,42,92,.5),0 14px 34px -18px rgba(14,42,92,.35),inset 0 1px 1px rgba(255,255,255,.95);
  opacity:0;visibility:hidden;transform:translateY(24px) scale(.97);transform-origin:100% 100%;transition:opacity .25s,transform .45s cubic-bezier(.2,1.15,.4,1),visibility 0s .45s}
.tp-panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;background:linear-gradient(150deg,#fff 0%,rgba(255,255,255,.3) 30%,rgba(14,42,92,.18) 65%,rgba(255,255,255,.9) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tp-panel::after{content:"";position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.tp.open .tp-panel{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .45s cubic-bezier(.2,1.15,.4,1)}
.tp-grab{display:none}
@media (max-width:639px){
  .tp-panel{left:0;right:0;bottom:0;width:auto;max-width:none;height:88vh;height:88svh;max-height:none;border-radius:26px 26px 0 0;opacity:1;transform:translateY(105%);
    transition:transform .42s cubic-bezier(.2,.9,.25,1),visibility 0s .42s}
  .tp.open .tp-panel{transform:translateY(0);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
  .tp-panel.drag{transition:none!important}
  .tp-grab{display:block;padding:9px 0 3px;touch-action:none}
  .tp-grab i{display:block;width:42px;height:5px;margin:0 auto;border-radius:999px;background:rgba(11,31,68,.2)}
}

.tp-hd{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 20px;border-bottom:1px solid rgba(255,255,255,.8);flex:none}
@media (max-width:639px){.tp-hd{padding-top:8px;touch-action:none}}
.tp-gr{font-weight:900;font-style:italic;font-size:1.6rem;letter-spacing:-.05em;line-height:1;color:var(--navy)}
.tp-gr i{font-style:inherit;color:var(--red)}
.tp-hd h2{font-size:1rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.tp-sub{font-size:.72rem;color:var(--ink-3);margin-top:2px}
.tp-sub .m{display:none}
@media (max-width:639px){.tp-sub[data-step="form"] .d{display:none}.tp-sub[data-step="form"] .m{display:inline}}
.tp-x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.tp-x svg{width:15px;height:15px}

.tp-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 20px 22px}
@media (max-width:639px){.tp-body{padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px))}}

/* step 1: form */
.tp-q{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.tp-f + .tp-f{margin-top:20px}
.tp-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tp-days button{height:46px;border-radius:14px;font-size:1.02rem;font-weight:600;color:var(--ink)}
.tp-starts{display:flex;flex-wrap:wrap;gap:8px}
.tp-starts button{border-radius:999px;padding:8px 14px;font-size:.8rem;font-weight:500;color:#334155}
.tp-starts button.lg-on{font-weight:600;color:var(--ink)}
.tp-ints{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tp-ints button{display:flex;align-items:center;gap:9px;min-height:50px;padding:9px 10px;border-radius:14px;text-align:left;font-size:.8rem;font-weight:600;line-height:1.2;color:var(--ink)}
.tp-ck{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(11,31,68,.3);background:rgba(255,255,255,.6);color:#fff;transition:background .2s,border-color .2s}
.tp-ck svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.tp-ints button[aria-checked="true"] .tp-ck{background:var(--navy);border-color:var(--navy)}
.tp-ints button[aria-checked="true"] .tp-ck svg{opacity:1;transform:none}
.tp-ints .ico{width:17px;height:17px;color:#2E5A92}
.tp-ints.shake{animation:tpShake .45s ease-in-out}
@keyframes tpShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tp-ppl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tp-ppl .tp-q{margin:0}
.tp-cnt{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.tp-cnt button{width:34px;height:34px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.tp-cnt button:hover{background:rgba(255,255,255,.7)}
.tp-cnt button:disabled{opacity:.35;cursor:default;background:none}
.tp-cnt button svg{width:14px;height:14px}
.tp-cnt output{min-width:30px;text-align:center;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tp-hint{margin-top:10px;text-align:center;font-size:.78rem;font-weight:600;color:var(--red)}

/* navy glass buttons */
.tp-go,.tp-book{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;color:#fff;font-weight:600;text-decoration:none;
  border:1px solid rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(40,70,128,.88),rgba(10,30,70,.95));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.3),inset 0 0 14px rgba(120,170,255,.2),0 14px 30px -12px rgba(10,30,70,.6);transition:transform .25s,box-shadow .25s}
.tp-go::after,.tp-book::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:44%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none;z-index:0}
.tp-go > *,.tp-book > *{position:relative;z-index:1}
.tp-go:hover,.tp-book:hover{transform:translateY(-1px);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.3),0 18px 34px -12px rgba(10,30,70,.65)}
.tp-go:active,.tp-book:active{transform:scale(.985)}
.tp-go{margin-top:24px;padding:15px 20px;font-size:.95rem}
.tp-go svg{width:15px;height:15px;color:#FFD56A}
.tp-book{padding:9px 20px 9px 9px;font-size:.92rem;margin-top:18px}
.tp-wa{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#7BE3A6,#22B262 55%,#13814A);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.2),0 4px 10px -4px rgba(31,163,90,.8)}
.tp-wa svg{width:16px;height:16px}

/* step 2: plan */
.tp-pt{font-size:1.18rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;color:var(--ink)}
.tp-pt:focus{outline:none}
.tp-ps{font-size:.82rem;color:var(--ink-2);margin-top:6px;line-height:1.45}
.tp-best{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:14px;font-size:.79rem;line-height:1.45;color:#5E4300;
  background:linear-gradient(180deg,rgba(255,245,212,.92),rgba(253,226,150,.55));box-shadow:inset 0 0 0 1px rgba(214,164,38,.45),inset 0 1px 1px #fff,0 8px 18px -12px rgba(154,106,5,.45)}
.tp-best svg{width:16px;height:16px;flex:none;color:#C98A06;margin-top:1px}
.tp-best b{color:#4A3400}
.tp-day{margin-top:20px}
.tp-dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tp-dh h4{font-size:.93rem;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.tp-pill{flex:none;font-size:.6rem;font-weight:800;letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,#24467F,#0B1F44);padding:4px 9px;border-radius:999px;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.tp-drive{font-size:.74rem;color:var(--ink-2);margin-top:3px;line-height:1.4}
.tp-also{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.tp-also + .tp-stops{margin-top:7px}
.tp-miss{margin-top:8px;font-size:.74rem;line-height:1.45;color:var(--ink-2)}
.tp-stops{list-style:none;padding:0;display:grid;gap:8px;margin-top:10px}
.tp-stop{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));box-shadow:inset 0 1px 1px #fff,inset 0 0 0 1px rgba(255,255,255,.7),0 8px 18px -14px rgba(14,42,92,.35);
  animation:tpRise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes tpRise{from{opacity:0;transform:translateY(14px)}}
.tp-si{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#2E5A92;background:linear-gradient(180deg,rgba(225,238,252,.95),rgba(200,222,245,.6));box-shadow:inset 0 1px 1px #fff,inset 0 0 0 1px rgba(46,90,146,.15)}
.tp-si .ico{width:16px;height:16px}
.tp-sn{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-size:.88rem;font-weight:700;color:var(--ink);line-height:1.3}
.tp-cat{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4B5B73;padding:2px 8px;border-radius:999px;background:rgba(11,31,68,.06)}
.tp-hr{font-size:.72rem;font-weight:600;color:var(--ink-3)}
.tp-sd{font-size:.78rem;color:#334155;margin-top:3px;line-height:1.45}
.tp-sv{font-size:.74rem;color:#9A6A05;margin-top:4px;line-height:1.4}
.tp-meta{font-size:.78rem;color:#334155;margin-top:9px;line-height:1.55}
.tp-meta b{color:var(--ink);font-weight:700}
.tp-veh{display:flex;align-items:center;gap:10px;margin-top:20px;padding:11px 14px;border-radius:14px;font-size:.8rem;color:#334155;line-height:1.4}
.tp-veh .ico{color:#2E5A92}
.tp-veh b{color:var(--ink)}
.tp-tips{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,248,226,.85),rgba(255,236,180,.4));box-shadow:inset 0 0 0 1px rgba(214,164,38,.35),inset 0 1px 1px #fff}
.tp-tips h4{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A6A05;margin-bottom:6px}
.tp-tips ul{list-style:none;padding:0;display:grid;gap:5px}
.tp-tips li{display:flex;gap:8px;font-size:.77rem;color:#3F3A2E;line-height:1.45}
.tp-tips li::before{content:"✦";flex:none;color:var(--gold);font-size:.7rem;line-height:1.6}
.tp-row{display:flex;gap:8px;margin-top:10px}
.tp-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--ink)}
.tp-row svg{width:15px;height:15px}
.tp-fine{margin-top:12px;text-align:center;font-size:.7rem;color:var(--ink-3)}
.tp-copybox{width:100%;height:120px;margin-top:10px;padding:10px;border-radius:12px;border:1px solid rgba(11,31,68,.2);font:inherit;font-size:.74rem;color:var(--ink);background:rgba(255,255,255,.85);resize:vertical}
.tp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .tp *,.tp *::before,.tp *::after{animation:none!important;transition:none!important}
}
</style>

<script>/*PLANNER-START*/
/* GR Tours & Travels – offline trip planning engine.
 * Pure function, no DOM, no network. Works in the browser (window.GRPlanner) and in Node (module.exports).
 *
 *   GRPlanner.plan(DATA, { days: 1-4, start: 'Murdeshwar', interests: ['Beaches & Islands', ...], people: 4 })
 *
 * DATA = places.json: { neighbours, areas: {area:{lat,lng}}, starts: {name:{lat,lng}},
 *                       places: [{district, area, area_town, place, category, hours, description, note, top, hard}] }
 *
 * How it plans
 *  - Drive time is estimated from town coordinates (straight line x 1.3 road factor, 50 km/h average on these roads).
 *  - Each day picks one base area (plus areas within ~50 min of it) that gives the most value for the chosen interests,
 *    minus the drive to get there. Interests not yet covered earn a bonus, so a mixed choice is spread over the days.
 *  - The trip never drives more than ~4.5 h in a day, and the last day must be able to get back to the pickup point.
 *  - Inside a day: matching must-see places first, then other matching places, then (only to reach 3 stops) nearby
 *    must-see highlights. Hard places only when their own category was chosen, at most one a day, never for 8+ people.
 *  - Deterministic: the same inputs always give the same plan.
 */
(function (root) {
  'use strict';

  var INTERESTS = {
    'Waterfalls': ['waterfall'],
    'Beaches & Islands': ['beach', 'island'],
    'Temples & Heritage': ['temple', 'heritage'],
    'Nature & Adventure': ['nature', 'viewpoint', 'park', 'adventure'],
    'Wildlife': ['wildlife'],
    'Historical Forts': ['fort']
  };
  var CAT_LABEL = { waterfall: 'waterfalls', beach: 'beaches', island: 'islands', temple: 'temples', heritage: 'heritage',
    nature: 'nature', viewpoint: 'viewpoints', park: 'parks', adventure: 'adventure', wildlife: 'wildlife', fort: 'forts' };
  var INTEREST_SHORT = { 'Waterfalls': 'Waterfalls', 'Beaches & Islands': 'Beaches', 'Temples & Heritage': 'Temples',
    'Nature & Adventure': 'Nature', 'Wildlife': 'Wildlife', 'Historical Forts': 'Forts' };

  var DAY_HOURS = 10;         // a full touring day incl. driving (about 8 am to 6 pm)
  var MAX_DRIVE_H = 4.5;      // longest drive allowed in one day
  var NEAR_H = 0.85;          // areas this close to the base can be added to the same day
  var STOP_GAP_H = 0.35;      // local driving / parking between two stops in the same area
  var FOOD = {
    'Uttara Kannada': ['Neer dosa with fish curry', 'Kadubu with coconut chutney', 'Goli baje and filter coffee'],
    'Ghats': ['Jolada rotti with ennegai', 'Kadubu with coconut chutney', 'Akki rotti with chutney'],
    'Udupi': ['Udupi vegetarian thali', 'Goli baje and filter coffee', 'Masala dosa'],
    'Dakshina Kannada': ['Kori rotti', 'Mangalorean fish curry', 'Mangalore buns'],
    'Nearby (border)': ['Local vegetarian meals', 'Neer dosa with fish curry', 'Filter coffee and snacks']
  };
  // the region's best-known sights: always planned first when their kind is chosen
  var STAR = {}; ['Jog Falls', 'Om Beach', 'Murdeshwar Temple & Shiva Statue', 'Sri Krishna Matha', 'Mahabaleshwar Temple',
    'Netrani Island', 'Kollur Mookambika Temple', "St Mary's Island", 'Yana Rocks', 'Mirjan Fort', 'Malpe Beach',
    'Sri Marikamba Temple', 'Dharmasthala Manjunatha Temple', 'Kukke Subramanya Temple', 'Kali River Rafting',
    'Unchalli (Lushington) Falls', 'Sathodi Falls', 'Devbagh Beach', 'Kudle Beach', 'Panambur Beach'].forEach(function (n) { STAR[n] = 1; });
  // the six places most visitors come for
  ['Jog Falls', 'Om Beach', 'Murdeshwar Temple & Shiva Statue', 'Sri Krishna Matha', 'Mahabaleshwar Temple',
    'Dandeli Wildlife Sanctuary (Kali Tiger Reserve)'].forEach(function (n) { STAR[n] = 2; });
  var GHATS = { sirsi: 1, siddapur: 1, yellapur: 1, dandeli: 1, jog: 1, yana: 1 };

  function km(a, b) {
    var R = 6371, t = Math.PI / 180;
    var dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // crossing the Western Ghats (coast <-> Sirsi/Jog/Yellapur/Dandeli/Hubballi side) is slow, winding road
  function driveH(a, b) { var d = km(a, b) * 1.3; if (d < 3) return 0; return d / 50 * (!!a.up !== !!b.up ? 1.3 : 1); }
  function pen(h) { return 0.5 * h + 0.6 * Math.max(0, h - 2.5); } // long drives cost more
  function round15(h) { return Math.max(0.25, Math.round(h * 4) / 4); }
  function fmtH(h) {
    var m = Math.round(h * 60 / 15) * 15; if (m < 15) m = 15;
    var hh = Math.floor(m / 60), mm = m % 60;
    return (hh ? hh + ' h' : '') + (hh && mm ? ' ' : '') + (mm ? mm + ' min' : '');
  }

  function plan(DATA, opts) {
    var days = Math.max(1, Math.min(4, opts.days | 0 || 2));
    var people = Math.max(1, opts.people | 0 || 1);
    var interests = (opts.interests || []).filter(function (i) { return INTERESTS[i]; });
    var startName = DATA.starts[opts.start] ? opts.start : 'Murdeshwar';
    var wanted = {}; interests.forEach(function (i) { INTERESTS[i].forEach(function (c) { wanted[c] = i; }); });

    var UP = { sirsi: 1, siddapur: 1, yellapur: 1, dandeli: 1, jog: 1, 'Hubballi Airport': 1 };
    var A = {}, startPt;
    Object.keys(DATA.areas).forEach(function (k) { A[k] = { lat: DATA.areas[k].lat, lng: DATA.areas[k].lng, up: !!UP[k] }; });
    startPt = { lat: DATA.starts[startName].lat, lng: DATA.starts[startName].lng, up: !!UP[startName] };
    var places = DATA.places.map(function (p, i) { return Object.assign({ idx: i }, p); });
    function allowed(p) {
      if (!p.hard) return true;
      return !!wanted[p.category] && people < 8;
    }
    function value(p) {
      if (!allowed(p)) return 0;
      var star = STAR[p.place];
      if (wanted[p.category] && p.hard) return 1;
      if (wanted[p.category]) return STAR[p.place] === 2 ? 8 : star ? 6 : p.top ? 3.5 : 1.5;
      return star ? 1 : p.top ? 0.6 : 0.15;
    }
    var byArea = {};
    places.forEach(function (p) { (byArea[p.area] = byArea[p.area] || []).push(p); });
    var areaNames = Object.keys(A).sort();

    var BEAM = 14;
    // beam search over day bases: keeps the best partial trips so early days leave room for later ones
    var beam = [{ score: 0, used: {}, covered: {}, cur: startPt, curName: startName, days: [] }];
    for (var d = 0; d < days; d++) {
      var last = d === days - 1, next = [];
      beam.forEach(function (st) {
        areaNames.forEach(function (base) {
          var drv = driveH(st.cur, A[base]);
          if (drv > MAX_DRIVE_H) return;
          var home = driveH(A[base], startPt);
          var back = last ? home : 0;
          if (last && back > MAX_DRIVE_H) return;
          if (!last && home > MAX_DRIVE_H * (days - d - 1) + 0.01) return;
          if (drv + back > 6) return;                       // no more than ~6 h in the vehicle on one day
          var budget = DAY_HOURS - drv - back;
          if (budget < 2) return;
          var day = fillDay(base, budget, st.used, st.covered);
          if (!day.stops.length) return;
          if (day.stops.length === 1 && day.stops[0].hard) return; // a hard trek is never the whole day
          // the base must be where the day really is: it holds the most stops (so labels and nights are honest)
          var perArea = {}; day.stops.forEach(function (s) { perArea[s.area] = (perArea[s.area] || 0) + 1; });
          var maxA = 0; for (var a in perArea) maxA = Math.max(maxA, perArea[a]);
          if ((perArea[base] || 0) < maxA) return;
          var bestStop = day.stops.slice().sort(function (x, y) { return value(y) - value(x) || x.idx - y.idx; })[0];
          if (bestStop.area !== base && perArea[bestStop.area] === maxA) return;
          var newCov = {}, matches = 0;
          day.stops.forEach(function (s) { if (!s.filler) { matches++; if (!st.covered[wanted[s.category]]) newCov[wanted[s.category]] = 1; } });
          // diminishing returns: the 4th+ place of the same kind in one trip counts half
          // and a 4th stop in one day counts a little less than the day's three best stops
          var cc = Object.assign({}, st.cats || {}), vals = [];
          day.stops.forEach(function (s) { vals.push(value(s) * ((cc[s.category] || 0) >= 3 ? 0.5 : 1)); cc[s.category] = (cc[s.category] || 0) + 1; });
          vals.sort(function (x, y) { return y - x; });
          var val = vals.reduce(function (t, v, j) { return t + v * (j >= 3 ? 0.6 : 1); }, 0);
          var gain = val + 5 * Object.keys(newCov).length - pen(drv) - pen(back) - (interests.length && !matches ? 3 : 0)
            + (day.stops.length >= 3 ? 0.5 : 0);
          var used = Object.assign({}, st.used), covered = Object.assign({}, st.covered);
          day.stops.forEach(function (s) { used[s.idx] = 1; if (!s.filler) covered[wanted[s.category]] = 1; });
          next.push({ score: st.score + gain, used: used, covered: covered, cats: cc, cur: A[base], curName: byArea[base][0].area_town,
            days: st.days.concat([{ base: base, drv: drv, back: back, day: day, from: st.curName }]) });
        });
      });
      if (!next.length) break;
      next.sort(function (a, b) {
        return b.score - a.score || (a.days.map(function (x) { return x.base; }).join() < b.days.map(function (x) { return x.base; }).join() ? -1 : 1);
      });
      // keep variety in the beam: at most 3 states ending at the same base
      var seenBase = {}; beam = [];
      for (var k = 0; k < next.length && beam.length < BEAM; k++) {
        var lb = next[k].days[next[k].days.length - 1].base;
        if ((seenBase[lb] = (seenBase[lb] || 0) + 1) <= 3) beam.push(next[k]);
      }
    }
    var bestState = beam[0];
    var covered = bestState.covered, out = [], foodIdx = {};
    bestState.days.forEach(function (b, d) {
      var last = d === bestState.days.length - 1;
      var baseTown = byArea[b.base][0].area_town;
      var distKey = GHATS[b.base] ? 'Ghats' : byArea[b.base][0].district;
      var fi = foodIdx[distKey] || 0; foodIdx[distKey] = fi + 1;
      var groups = rankLabels(b.day.stops.filter(function (s) { return !s.filler; }).map(function (s) { return CAT_LABEL[s.category]; }));
      out.push({
        day: d + 1,
        base: b.base,
        town: baseTown,
        theme: baseTown + ' ' + (groups.length ? joinAnd(groups.slice(0, 2)) : 'highlights'),
        driveFrom: b.from,
        driveHours: round15(b.drv),
        driveText: b.drv >= 0.5 ? (d === 0 ? 'Pickup at ' + b.from + ' · drive ≈ ' : 'Drive ≈ ') + fmtH(b.drv) + (d === 0 ? ' to ' + baseTown : ' from ' + b.from) : (d === 0 ? 'Pickup at ' + b.from : ''),
        stops: b.day.stops.map(function (s) {
          return { place: s.place, category: s.category, hours: s.hours, description: s.description, note: s.note,
                   town: s.area_town, filler: !!s.filler, top: !!s.top };
        }),
        hasFiller: b.day.stops.some(function (s) { return s.filler; }),
        night: last ? null : baseTown,
        end: last ? 'Drop back at ' + startName + (b.back >= 0.5 ? ' (≈ ' + fmtH(b.back) + ')' : '') : null,
        food: FOOD[distKey][fi % 3]
      });
    });

    function fillDay(base, budget, used, covSoFar) {
      var near = areaNames.filter(function (a) { return a === base || driveH(A[base], A[a]) <= NEAR_H; });
      var pool = [];
      near.forEach(function (a) {
        (byArea[a] || []).forEach(function (p) {
          if (used[p.idx] || !allowed(p)) return;
          var extra = a === base ? 0 : driveH(A[base], A[a]);
          pool.push({ p: p, extra: extra });
        });
      });
      // order: matching must-see, matching, then filler must-see, other filler; same-area before nearby; data order
      function rank(x) {
        var m = wanted[x.p.category] ? 0 : 3;
        return m + (STAR[x.p.place] ? -1 : x.p.top ? 0 : x.p.hard ? 2 : 1);   // hard treks only after easy places
      }
      pool.sort(function (a, b) { return rank(a) - rank(b) || a.extra - b.extra || a.p.idx - b.p.idx; });
      var stops = [], time = 0, val = 0, hard = 0, cats = {}, areasUsed = {};
      areasUsed[base] = 1;
      function tryAdd(x, isFiller) {
        if (stops.length >= 4) return false;
        if (x.p.hard && hard) return false;
        var big = x.p.hours >= 6;
        if (big && stops.length) return false;
        if (stops.length && stops[0].hours >= 6) return false;
        var hop = areasUsed[x.p.area] ? 0 : x.extra;
        var need = x.p.hours + (stops.length ? STOP_GAP_H : 0) + hop;
        if (time + need > budget + 1e-9) return false;
        // variety: don't take a 3rd stop of the same category while other matching categories exist
        if (!isFiller && cats[x.p.category] >= 2 && interests.length && Object.keys(wanted).length > 1) {
          var other = pool.some(function (y) { return !stops.some(function (s) { return s.idx === y.p.idx; }) && wanted[y.p.category] && y.p.category !== x.p.category && y.p.hours <= budget - time; });
          if (other) return false;
        }
        var s = Object.assign({}, x.p, { filler: isFiller });
        stops.push(s); time += need; val += value(x.p); if (x.p.hard) hard++;
        cats[x.p.category] = (cats[x.p.category] || 0) + 1; areasUsed[x.p.area] = 1;
        return true;
      }
      // first: one place for each chosen interest not yet covered on earlier days (scarcest interest first)
      var open = interests.filter(function (i) { return !covSoFar[i]; }).map(function (i) {
        var c = pool.filter(function (x) { return wanted[x.p.category] === i; });
        return { i: i, c: c };
      }).filter(function (o) { return o.c.length; }).sort(function (a, b) { return a.c.length - b.c.length || interests.indexOf(a.i) - interests.indexOf(b.i); });
      open.forEach(function (o) { for (var j = 0; j < o.c.length; j++) if (tryAdd(o.c[j], false)) break; });
      pool.forEach(function (x) { if ((wanted[x.p.category] || !interests.length) && !stops.some(function (s) { return s.idx === x.p.idx; })) tryAdd(x, false); });
      // second pass for skipped matching places once variety is satisfied
      pool.forEach(function (x) { if ((wanted[x.p.category] || !interests.length) && !stops.some(function (s) { return s.idx === x.p.idx; })) tryAdd(x, false); });
      if (stops.length < 3) {
        pool.forEach(function (x) {
          if (stops.length >= 3) return;
          if (wanted[x.p.category] || stops.some(function (s) { return s.idx === x.p.idx; })) return;
          if (!x.p.top && stops.length >= 2) return;      // only must-see filler to reach the 3rd stop
          tryAdd(x, true);

      out.push('Day ' + d.day + ': ' + d.theme);
      if (d.driveText) out.push(d.driveText);
      d.stops.filter(function(s){ return !s.filler; }).forEach(line);
      var extra = d.stops.filter(function(s){ return s.filler; });
      if (extra.length){ out.push('Also nearby:'); extra.forEach(line); }
      out.push(d.night ? 'Night stay: ' + d.night + ' — rooms arranged on request' : d.end);
      out.push('Local food: ' + d.food, '');
    });
    out.push('Vehicle: ' + p.vehicle + ' for ' + p.people + (p.people > 1 ? ' people' : ' person'));
    out.push('Tips: ' + TIPS.join(' '));
    out.push('GR Tours & Travels · WhatsApp 96209 36143 · Price on WhatsApp');
    return out.join('\n');
  }
  function copyPlan(btn){
    var text = planText(current), label = btn.querySelector('span');
    function done(){ label.textContent = 'Copied ✓'; setTimeout(function(){ label.textContent = 'Copy plan'; }, 2000); }
    function fallback(){
      var ta = planEl.querySelector('.tp-copybox');
      if (!ta){ ta = document.createElement('textarea'); ta.className = 'tp-copybox'; ta.readOnly = true; ta.setAttribute('aria-label', 'Plan text'); btn.parentNode.insertAdjacentElement('afterend', ta); }
      ta.value = text; ta.focus(); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) done(); else label.textContent = 'Select and copy';
    }
    if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
  }
  planEl.addEventListener('click', function(e){
    if (e.target.closest('.tp-again')) showForm();
    var c = e.target.closest('.tp-copy'); if (c) copyPlan(c);
  });

  // ---- open / close ----
  var isOpen = false, locked = false, prevHtml = '', prevBody = '';
  function lock(on){
    var de = document.documentElement;
    if (on && !locked){ prevHtml = de.style.overflow; prevBody = document.body.style.overflow; de.style.overflow = 'hidden'; document.body.style.overflow = 'hidden'; locked = true; }
    else if (!on && locked){ de.style.overflow = prevHtml; document.body.style.overflow = prevBody; locked = false; }
  }
  function open(){
    if (isOpen) return;
    isOpen = true; root.classList.add('open'); spark.setAttribute('aria-expanded', 'true');
    lock(phoneMQ.matches);
    requestAnimationFrame(function(){ panel.focus({preventScroll: true}); });
  }
  function close(){
    if (!isOpen) return;
    isOpen = false; root.classList.remove('open'); spark.setAttribute('aria-expanded', 'false');
    lock(false); panel.style.transform = '';
    spark.focus({preventScroll: true});
  }
  spark.addEventListener('click', open);
  lbl.addEventListener('click', open);
  $('.tp-x').addEventListener('click', close);
  scrim.addEventListener('click', close);
  phoneMQ.addEventListener ? phoneMQ.addEventListener('change', function(){ if (isOpen) lock(phoneMQ.matches); }) : phoneMQ.addListener(function(){ if (isOpen) lock(phoneMQ.matches); });

  function focusables(){
    return Array.prototype.slice.call(panel.querySelectorAll('button, a[href], textarea, input, [tabindex]:not([tabindex="-1"])')).filter(function(el){
      return !el.disabled && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden';
    });
  }
  document.addEventListener('keydown', function(e){
    if (!isOpen) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    var f = focusables(); if (!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (e.shiftKey && (a === first || !panel.contains(a) || a === panel)){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (a === last || !panel.contains(a))){ e.preventDefault(); first.focus(); }
  });
  document.addEventListener('focusin', function(e){ if (isOpen && !panel.contains(e.target)) panel.focus({preventScroll: true}); });

  // swipe down to close (phone sheet)
  var drag = null;
  panel.addEventListener('touchstart', function(e){
    if (!isOpen || !phoneMQ.matches || e.touches.length !== 1) return;
    var head = !!e.target.closest('.tp-grab, .tp-hd');
    if (!head && body.scrollTop > 0) return;
    drag = {y0: e.touches[0].clientY, y: e.touches[0].clientY, t0: Date.now(), head: head, on: false};
  }, {passive: true});
  panel.addEventListener('touchmove', function(e){
    if (!drag) return;
    var y = e.touches[0].clientY, dy = y - drag.y0; drag.y = y;
    if (!drag.on){
      if (dy > 6 && (drag.head || body.scrollTop <= 0)){ drag.on = true; panel.classList.add('drag'); }
      else if (dy < -6){ drag = null; return; }
      else return;
    }
    e.preventDefault();
    panel.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
  }, {passive: false});
  function endDrag(){
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.on) return;
    var dy = d.y - d.y0, v = dy / Math.max(1, Date.now() - d.t0);
    panel.classList.remove('drag'); panel.style.transform = '';
    if (dy > 110 || (dy > 40 && v > 0.6)) close();
  }
  panel.addEventListener('touchend', endDrag);
  panel.addEventListener('touchcancel', endDrag);

  // keep the ✦ button 12px above the "Chat with us" button at every size
  function place(){
    var fab = document.querySelector('.s-footer .fab') || document.querySelector('a.fab');
    var r = fab && fab.getBoundingClientRect();
    if (!r || !r.height){ launch.style.bottom = ''; return; }
    var vh = document.documentElement.clientHeight;
    launch.style.bottom = Math.round(vh - r.top + 12) + 'px';
  }
  // never sit on top of a button, link or field of the section underneath
  var coverRaf = 0;
  function shown(el){
    for (var n = el; n && n !== document.body; n = n.parentElement){
      var cs = getComputedStyle(n);
      if (cs.visibility === 'hidden' || cs.display === 'none' || parseFloat(cs.opacity) < 0.05 || cs.pointerEvents === 'none') return false;
    }
    return true;
  }
  function covers(box, list){
    return list.some(function(t){
      var q = t.getBoundingClientRect();
      return q.width && q.height && q.right > box.left && q.left < box.right && q.bottom > box.top && q.top < box.bottom && shown(t);
    });
  }
  function checkCover(){
    coverRaf = 0;
    if (isOpen) return;
    var list = Array.prototype.filter.call(document.querySelectorAll('a[href], button, input, select, textarea, [role="button"], [role="tab"]'), function(t){
      return !root.contains(t) && !t.closest('.fab');
    });
    var sparkHit = covers(spark.getBoundingClientRect(), list);
    var lblBox = lbl.getBoundingClientRect(), lblHit = !sparkHit && lblBox.width > 0 && covers(lblBox, list);
    launch.classList.toggle('tuck', sparkHit);
    launch.classList.toggle('nolbl', lblHit);
  }
  var settle = [];
  function queueCover(){ if (!coverRaf) coverRaf = requestAnimationFrame(checkCover); }
  function onScroll(){   // check now, and again once the sections underneath have finished animating
    queueCover();
    settle.forEach(clearTimeout);
    settle = [setTimeout(queueCover, 250), setTimeout(queueCover, 700)];
  }
  addEventListener('scroll', onScroll, {passive: true});
  document.addEventListener('transitionend', queueCover, true);
  document.addEventListener('animationend', queueCover, true);

  place();
  queueCover();
  addEventListener('resize', function(){ place(); queueCover(); });
  addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);

  paint();
})();
</script>
